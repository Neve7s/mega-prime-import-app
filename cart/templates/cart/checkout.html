{% extends "base.html" %}
{% block title %}Finalizar pedido — {{ site_settings.site_name|default:"MEGA PRIME" }}{% endblock %}
{% block content %}
<div class="max-w-[1100px] mx-auto px-6 py-12 grid grid-cols-1 lg:grid-cols-2 gap-8">
  <div>
    <h1 class="font-grotesk text-2xl font-bold">Tu carrito</h1>
    <div id="cart-items" class="mt-4 flex flex-col gap-3"></div>
    <p class="mt-4 font-bold">Total: <span id="cart-total">USD 0.00</span></p>
  </div>
  <div class="bg-white border rounded-xl p-6">
    <h2 class="font-grotesk text-xl font-bold">Procesar pedido</h2>
    <p class="text-sm text-gray-600 mt-1">Usa el <strong>código</strong> que te compartimos por WhatsApp junto a tus datos.</p>
    <form id="checkout-form" class="mt-4 flex flex-col gap-3">
      {% csrf_token %}
      <label class="text-xs font-bold uppercase">Código de compra (WhatsApp) *<input name="codigo" required class="mt-1 w-full border rounded px-3 py-2" placeholder="MPI-XXXXXX" /></label>
      <label class="text-xs font-bold uppercase">Nombre completo *<input name="nombre_completo" required class="mt-1 w-full border rounded px-3 py-2" /></label>
      <label class="text-xs font-bold uppercase">Documento de identidad *<input name="documento_identidad" required class="mt-1 w-full border rounded px-3 py-2" placeholder="Cédula / RUC / Pasaporte" /></label>
      <label class="text-xs font-bold uppercase">Correo electrónico *<input name="email" type="email" required class="mt-1 w-full border rounded px-3 py-2" /></label>
      <label class="text-xs font-bold uppercase">Número de teléfono *<input name="telefono" required class="mt-1 w-full border rounded px-3 py-2" placeholder="+593 ..." /></label>
      <label class="text-xs font-bold uppercase">Ciudad<input name="ciudad" class="mt-1 w-full border rounded px-3 py-2" /></label>
      <label class="text-xs font-bold uppercase">Notas<textarea name="notas" class="mt-1 w-full border rounded px-3 py-2"></textarea></label>
      <p id="checkout-error" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded p-3"></p>
      <button class="bg-[#1e232a] text-white font-bold py-3 rounded">Procesar pedido</button>
    </form>
  </div>
</div>
<script>
document.getElementById("checkout-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("checkout-error");
  err.classList.add("hidden");
  const fd = new FormData(e.target);
  const res = await fetch("{% url 'cart:checkout' %}", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-CSRFToken": fd.get("csrfmiddlewaretoken") },
    body: JSON.stringify({
      codigo: fd.get("codigo"),
      datos: { nombre_completo: fd.get("nombre_completo"), documento_identidad: fd.get("documento_identidad"), email: fd.get("email"), telefono: fd.get("telefono"), ciudad: fd.get("ciudad"), notas: fd.get("notas") },
      items: window.MpiCart.items(),
    }),
  });
  const data = await res.json();
  if (!data.ok) { err.textContent = data.error; err.classList.remove("hidden"); return; }
  window.MpiCart.clear();
  window.location.href = data.confirm_url;
});
</script>
{% endblock %}
