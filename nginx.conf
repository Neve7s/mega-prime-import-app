server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Healthcheck para Coolify / Docker
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Pagina principal
  location = / {
    try_files /index.html =404;
  }

  # Cache para assets (si agregas css/js/img locales despues)
  location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Compresion
  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 1024;

  # Headers basicos de seguridad
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
