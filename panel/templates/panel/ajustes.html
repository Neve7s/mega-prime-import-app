{% extends "panel/base_panel.html" %}
{% block title %}Ajustes — Panel{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold">Ajustes del sitio</h1>
{% if ok %}<p class="mt-2 text-sm text-green-700 bg-green-50 border rounded p-3">Guardado. El público lo ve al instante.</p>{% endif %}
<form method="post" enctype="multipart/form-data" class="mt-4 bg-white border rounded-xl p-6 flex flex-col gap-3 max-w-2xl">{% csrf_token %}{{ form.as_p }}
<button class="bg-[#1e232a] text-white py-2 rounded font-bold">Guardar</button></form>
{% endblock %}
