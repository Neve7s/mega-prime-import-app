<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingresar al panel — MEGA PRIME</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#080d13] text-white min-h-screen flex items-center justify-center">
<div class="bg-white text-gray-900 rounded-xl p-8 w-full max-w-sm">
  <h1 class="font-bold text-xl">MEGA PRIME <span class="text-[#b45309]">Panel</span></h1>
  <p class="text-sm text-gray-500">Acceso solo personal de tienda.</p>
  <form method="post" class="mt-4 flex flex-col gap-3">{% csrf_token %}{{ form.as_p }}
  <button class="bg-[#1e232a] text-white py-2 rounded font-bold">Entrar</button></form>
</div>
</body>
</html>
