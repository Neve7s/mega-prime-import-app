<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingresar — MEGA PRIME Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { font-family: 'IBM Plex Sans', sans-serif; } h1 { font-family: 'Archivo', sans-serif; }</style></head>
<body class="bg-[#0A0A0B] min-h-screen flex items-center justify-center px-4" style="background-image: radial-gradient(#D4AF37 1px, transparent 1px); background-size: 26px 26px;">
<div class="w-full max-w-md">
  <div class="text-center mb-6">
    <div class="text-4xl font-extrabold tracking-tight text-white" style="font-family:'Archivo',sans-serif">LGM</div>
    <div class="text-[11px] font-bold tracking-[0.22em] text-white/80">MEGA PRIME</div>
    <div class="text-[11px] font-bold tracking-[0.22em] text-[#D4AF37]">IMPORT · PANEL DE TIENDA</div>
  </div>
  <div class="bg-white rounded-2xl p-8 shadow-2xl">
    <h1 class="font-bold text-xl text-gray-900">Ingresar</h1>
    <p class="text-sm text-gray-500 mt-1">Acceso solo personal de tienda.</p>
    {% if form.non_field_errors %}<div class="mt-4 text-sm font-semibold text-red-700 bg-red-50 border border-red-200 rounded-lg p-3">{% for e in form.non_field_errors %}{{ e }}<br />{% endfor %}</div>{% endif %}
    <form method="post" class="mt-5 flex flex-col gap-4">{% csrf_token %}
      <label class="text-xs font-bold uppercase tracking-wider text-gray-700">Usuario{{ form.username }}</label>
      <label class="text-xs font-bold uppercase tracking-wider text-gray-700">Contraseña{{ form.password }}</label>
      {% for f in form %}{% for e in f.errors %}<p class="text-xs font-semibold text-red-700">{{ e }}</p>{% endfor %}{% endfor %}
      <style>input[name=username], input[name=password] { width: 100%; border: 1px solid #d4d4d8; border-radius: 0.5rem; padding: 0.6rem 0.75rem; margin-top: 0.25rem; font-size: 0.95rem; } input:focus { outline: none; border-color: #D4AF37; box-shadow: 0 0 0 2px rgba(212,175,55,0.25); }</style>
      <button class="bg-[#0A0A0B] text-[#D4AF37] py-2.5 rounded-lg font-bold hover:bg-black">Entrar al panel</button>
    </form>
  </div>
  <p class="text-center mt-5"><a href="{% url 'core:home' %}" class="text-sm text-white/60 hover:text-[#D4AF37] underline">← Volver al sitio</a></p>
</div>
</body>
</html>
