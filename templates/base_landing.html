<style id="tema-sitio">:root{--tema-primario:{{ site_settings.color_primario|default:'#D4AF37' }};--tema-secundario:{{ site_settings.color_secundario|default:'#0A0A0B' }};--tema-fondo:{{ site_settings.color_fondo|default:'#FAFAF8' }};--tema-tarjetas:{{ site_settings.color_tarjetas|default:'#FFFFFF' }};--tema-texto:{{ site_settings.color_texto|default:'#131313' }};--tema-acento:{{ site_settings.color_acento|default:'#15803D' }};--fuente-cuerpo:'{{ site_settings.fuente_cuerpo|default:'IBM Plex Sans' }}',sans-serif;--fuente-titulos:'{{ site_settings.fuente_titulos|default:'Libre Franklin' }}',sans-serif;}
.bg-secondary-container,.bg-secondary{background-color:var(--tema-primario)!important;}
.hover\:bg-secondary:hover{background-color:color-mix(in srgb,var(--tema-primario) 68%,black)!important;}
.text-secondary,.text-secondary-container,.text-secondary-fixed,.text-secondary-fixed-dim,.text-on-tertiary-container{color:color-mix(in srgb,var(--tema-primario) 72%,black)!important;}
.border-secondary{border-color:var(--tema-primario)!important;}
.bg-primary,.bg-primary-container{background-color:var(--tema-secundario)!important;}
.hover\:bg-primary-container:hover{background-color:color-mix(in srgb,var(--tema-secundario) 88%,white)!important;}
.text-primary{color:var(--tema-secundario)!important;}
.border-primary{border-color:var(--tema-secundario)!important;}
.bg-surface{background-color:var(--tema-fondo)!important;}
.bg-surface-container-lowest,.bg-surface-container-low,.bg-surface-container,.bg-surface-container-high,.bg-surface-container-highest{background-color:var(--tema-tarjetas)!important;}
.text-on-surface{color:var(--tema-texto)!important;}
body{color:var(--tema-texto)!important;}
.bg-green-700{background-color:var(--tema-acento)!important;}
.bg-green-800{background-color:color-mix(in srgb,var(--tema-acento) 82%,black)!important;}
.text-green-700{color:var(--tema-acento)!important;}

<script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "secondary": "#8C6D00", "on-primary": "#ffffff", "surface-tint": "#6B6250", "on-secondary": "#ffffff", "tertiary-fixed-dim": "#E4C56C", "on-primary-fixed-variant": "#4E4A3E", "surface-container-high": "#E2DED2", "on-secondary-fixed": "#201800", "surface-container-highest": "#D8D4C6", "surface-container-lowest": "#ffffff", "on-secondary-container": "#4A3800", "surface-variant": "#D8D4C6", "outline-variant": "#CFCABA", "on-primary-fixed": "#17150F", "on-surface-variant": "#4A4A45", "secondary-fixed-dim": "#F4DC94", "primary": "#0A0A0B", "error-container": "#ffdad6", "surface-container-low": "#F3F1EA", "tertiary": "#0E0D0B", "primary-container": "#161617", "on-surface": "#131313", "primary-fixed": "#E5E0D2", "on-tertiary": "#ffffff", "outline": "#76726A", "on-tertiary-fixed": "#241B00", "on-secondary-fixed-variant": "#6E5200", "surface-container": "#ECE9DF", "surface-bright": "#ffffff", "inverse-primary": "#C9C2AF", "on-error-container": "#93000a", "tertiary-fixed": "#EAD9A8", "surface-dim": "#E4E2DA", "on-background": "#131313", "secondary-fixed": "#E8C86A", "surface": "#FAFAF8", "error": "#ba1a1a", "inverse-on-surface": "#F2EEE2", "on-tertiary-container": "#D4AF37", "primary-fixed-dim": "#C9C2AF", "on-primary-container": "#A09A8A", "on-tertiary-fixed-variant": "#7A5F1E", "on-error": "#ffffff", "secondary-container": "#D4AF37", "background": "#FAFAF8", "tertiary-container": "#1C1917", "inverse-surface": "#141414" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-xl": "2.5rem", "space-md": "1rem", "gutter-sm": "1rem", "margin": "1.5rem", "margin-lg": "5rem", "margin-md": "3rem", "gutter-lg": "2rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "space-sm": "0.5rem", "gutter": "1.5rem" }, "fontFamily": { "label-lg": [ "Libre Franklin" ], "headline-sm": [ "Libre Franklin" ], "body-md": [ "IBM Plex Sans" ], "headline-lg-mobile": [ "Libre Franklin" ], "body-sm": [ "IBM Plex Sans" ], "display-lg-mobile": [ "Libre Franklin" ], "body-lg": [ "IBM Plex Sans" ], "headline-lg": [ "Libre Franklin" ], "headline-md": [ "Libre Franklin" ], "display-lg": [ "Libre Franklin" ], "label-md": [ "Libre Franklin" ], "label-sm": [ "Libre Franklin" ] }, "fontSize": { "label-lg": [ "14px", { "lineHeight": "20px", "letterSpacing": "0.04em", "fontWeight": "600" } ], "headline-sm": [ "20px", { "lineHeight": "28px", "letterSpacing": "0em", "fontWeight": "600" } ], "body-md": [ "15px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" } ], "headline-lg-mobile": [ "28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" } ], "body-sm": [ "13px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "400" } ], "display-lg-mobile": [ "36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" } ], "body-lg": [ "18px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "400" } ], "headline-lg": [ "36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "600" } ], "headline-md": [ "24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" } ], "display-lg": [ "56px", { "lineHeight": "64px", "letterSpacing": "-0.03em", "fontWeight": "700" } ], "label-md": [ "12px", { "lineHeight": "16px", "letterSpacing": "0.06em", "fontWeight": "600" } ], "label-sm": [ "11px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "700" } ] } } } };</script></head><body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="bg-surface font-body-md text-body-md text-on-surface antialiased">{% include "core/partials/_header.html" %}<main>{% block content %}{% endblock %}</main><script>
    // In-memory quote basket items
    let quoteBasket = [];

    // Filter functionality
    document.addEventListener('DOMContentLoaded', () => {
      const filterButtons = document.querySelectorAll('.catalog-filter');
      const products = document.querySelectorAll('.product-item');

      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          filterButtons.forEach(b => {
            b.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
            b.classList.add('bg-surface-container-lowest', 'text-on-surface');
          });
          btn.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
          btn.classList.remove('bg-surface-container-lowest', 'text-on-surface');

          const category = btn.getAttribute('data-category');
          products.forEach(p => {
            if (category === 'all' || p.getAttribute('data-category') === category) {
              p.style.display = 'flex';
            } else {
              p.style.display = 'none';
            }
          });
        });
      });

      recalculateValues();
    });

    // Add to Quote Basket
    function addToQuote(productName, sku) {
      if (!quoteBasket.includes(sku)) {
        quoteBasket.push(sku);
      }
      updateBasketDisplay();
      
      // Feedback toast/alert
      const basketLabel = document.getElementById('basket-count-label');
      basketLabel.textContent = `${quoteBasket.length} producto(s) listo(s) en la cotización: ${productName}`;
      
      // Smooth scroll to calculator if on mobile
      const cotizador = document.getElementById('cotizador-express');
      if (cotizador) {
        cotizador.scrollIntoView({ behavior: 'smooth' });
      }
    }

    function clearBasket() {
      quoteBasket = [];
      updateBasketDisplay();
    }

    function updateBasketDisplay() {
      const basketLabel = document.getElementById('basket-count-label');
      if (quoteBasket.length === 0) {
        basketLabel.textContent = '0 productos seleccionados del catálogo';
      } else {
        basketLabel.textContent = `${quoteBasket.length} producto(s) en cola de requerimiento`;
      }
    }

    // Calculator Live Logic
    function recalculateValues() {
      const areaInput = document.getElementById('calc-area');
      const wasteLabel = document.getElementById('calc-waste-label');
      const totalLabel = document.getElementById('calc-total-label');
      const boxesLabel = document.getElementById('calc-boxes-label');
      
      if (!areaInput || !wasteLabel || !totalLabel) return;

      const area = parseFloat(areaInput.value) || 0;
      const wasteFactor = 0.10; // 10% Merma
      const waste = area * wasteFactor;
      const total = area + waste;
      
      // Standard assumption: ~2.88m² per box for 120x120 tiles
      const boxes = Math.ceil(total / 2.88);
      const pallets = Math.ceil(boxes / 24);

      wasteLabel.textContent = `+${waste.toFixed(2)} m²`;
      totalLabel.textContent = `${total.toFixed(2)} m²`;
      boxesLabel.textContent = `Aprox. ${boxes} Cajas / ${pallets} Palets Reforzados`;
    }

    // Submit handler
    function handleQuoteSubmit(e) {
      e.preventDefault();
      const projType = document.getElementById('calc-project-type').value;
      const prodLine = document.getElementById('calc-product-line').value;
      const area = document.getElementById('calc-total-label').textContent;
      const name = document.getElementById('quote-name').value;
      const phone = document.getElementById('quote-phone').value;
      const email = document.getElementById('quote-email').value;
      const location = document.getElementById('quote-location').value;

      const basketDetail = quoteBasket.length > 0 ? ` (SKUs en cola: ${quoteBasket.join(', ')})` : '';

      const message = `Hola MEGA PRIME, solicito cotización formal:%0A%0A• *Cliente/Empresa:* ${name}%0A• *Proyecto:* ${projType}%0A• *Línea:* ${prodLine}${basketDetail}%0A• *Volumen Total:* ${area}%0A• *Ubicación de Obra:* ${location}%0A• *Correo:* ${email}%0A• *Teléfono:* ${phone}`;

      const confirmation = document.getElementById('quote-confirmation');
      if (confirmation) {
        confirmation.classList.remove('hidden');
      }

      setTimeout(() => {
        window.open(`https://wa.me/593963796222?text=${message}`, '_blank');
      }, 800);
    }
  </script>
</div></main>
<script>
// Carrito MEGA PRIME: los botones del catálogo agregan al carrito localStorage.
function addToQuote(sku) {
  if (!window.MpiCart) { console.error("MpiCart no cargado (cart.js). Recarga con Ctrl+F5."); return; }
  var p = (window.MPI_PRODUCTS || {})[sku];
  if (!p) return;
  window.MpiCart.add(sku, p.nombre, p.precio);
  var label = document.getElementById("basket-count-label");
  if (label) {
    var n = 0;
    window.MpiCart.items().forEach(function (i) { n += i.cantidad; });
    label.textContent = n + " productos seleccionados del catálogo";
  }
}
</script>
